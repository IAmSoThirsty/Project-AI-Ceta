[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "societal-reasoning-core"
version = "1"
description = "Offline-first, provenance-aware societal concept graph and context reasoning prototype"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Thirsty's Projects LLC"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = []

[project.scripts]
sre = "societal_reasoning.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
societal_reasoning = ["resources/*.jsonl", "resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
